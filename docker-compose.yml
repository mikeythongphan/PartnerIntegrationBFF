version: '3.9'

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: partner-rabbitmq
    ports:
      - "5672:5672"       # AMQP
      - "15672:15672"     # Management UI (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - partner-net

  api:
    build:
      context: .
      dockerfile: src/PartnerIntegration.API/Dockerfile
    container_name: partner-integration-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - PartnerVerificationApi__BaseUrl=http://api:8080
      - ApiKeyAuthentication__ValidKeys__0=prod-api-key-replace-me
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - partner-net
    restart: unless-stopped

volumes:
  rabbitmq_data:

networks:
  partner-net:
    driver: bridge
